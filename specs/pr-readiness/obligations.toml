# Assertions that no control in the suite is required to fail. Each is still
# checked in every assurance run; what is missing is a demonstration that it
# can fail, and the reason says why none is kept.

[[uncontrolled]]
assertion = "NeverReturnsToDraft"
reason = "No action of the model can return a PR to draft, so there is no guard to mutate. The assertion guards against a later edit adding one."

[[uncontrolled]]
assertion = "ClaimsNeverOutrunTheRemote"
reason = "Every defect that would break it breaks VerifiedClaimNeedsMatchingReadBack first, on the step that writes the claim."

[[uncontrolled]]
assertion = "ImpasseLeavesTheDraftAlone"
reason = "An impasse is terminal, so no later step can transition; the assertion guards against a later edit that lets one."

[[uncontrolled]]
assertion = "SubsetEvidenceIsRecordable"
reason = "It is a witness that the undivided stack's subset verdict exists as evidence; its absence is shown by the first, vacuous draft of stack.fizz, not by a kept control."

# Obligation-to-evidence mapping for the PR-readiness specification.
#
# Each obligation names the shipped section that states it, a sentence that
# section must still contain, the assertions that express it, the suite runs
# that exercise it, and the evidence kept outside the model. The skill is
# the normative contract: this file records correspondence, it does not own
# policy. A matching sentence shows that the rule is still stated; it does
# not show that the prose and the model mean the same thing, which is a
# matter for review.
#
# tests/test_pr_readiness_obligations.py checks every reference here.


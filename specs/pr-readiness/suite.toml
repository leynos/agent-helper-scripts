[[run]]
id = "mutant-waiting-ends-the-assignment"
class = "negative-control"
of = "local-codescene-never-available"
purpose = "Ending the assignment when the local check is unavailable, instead of observing again, finishes on a wait: the PR stays draft and nothing merges, so only CompletionIsEarned can see it."
obligations = ["PRR-PROG-02"]
expect = { fail = "transition", assertion = "CompletionIsEarned", via = ['AgentRunsLocalDelta'] }
[[run.mutation]]
old = 'pc = "inspect" if delivery_gates_hold(obs, l_checks, l_local) else "start"'
new = 'pc = "inspect" if delivery_gates_hold(obs, l_checks, l_local) else "done"'

[[run]]
id = "mutant-ready-only-ends-on-unmatched-read-back"
class = "negative-control"
of = "ready-only-read-back-mismatch"
purpose = "Finishing a ready-only assignment on a read-back that did not match the candidate the command was issued for stops short of a verified transition."

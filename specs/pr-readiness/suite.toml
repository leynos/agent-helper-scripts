expect = { fail = "transition", assertion = "CompletionIsEarned", via = ['HeadChanges', 'AgentReadsBackReady'] }
[[run.mutation]]
old = 'pc = "done" if SCENARIOS[sc].authority == "ready-only" and verified else "start"'
new = 'pc = "done" if SCENARIOS[sc].authority == "ready-only" else "start"'

[[run]]
id = "mutant-completion-before-the-decision"
class = "negative-control"
of = "neither-assessment-applies"
purpose = "Ending the assignment while inspecting the discussion, with every delivery gate clear and both assessments justified as not applicable, finishes on clear evidence but before the decision and short of the merge the assignment authorizes."
obligations = ["PRR-PROG-02", "PRR-AUTH-01"]

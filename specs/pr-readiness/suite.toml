LAYERS = SPLIT
EXPECT_DELIVERY = "never"
'''
expect = { fail = "always", assertion = "UndeliverableStackNeverMerges", via = ["StackMerges"] }

# ---------------------------------------------------------------------------
# Expected counterexamples: recorded limitations of the documented protocol.
# The strong freshness properties ask that evidence be current in reality
# when a command takes effect. `gh pr ready` is unconditional and the merge
# guard names the head only, so these fail. They are NOT assurance.
# ---------------------------------------------------------------------------

[[run]]
id = "expected-counterexample-head-moves-before-ready"
class = "expected-counterexample"
purpose = "The head changes after the agent's last read and before `gh pr ready` takes effect; the PR becomes ready at a head nothing was assessed for."
obligations = ["PRR-TOCTOU-01"]
scenario = '''
SCENARIOS = [scenario(change_budget=1, env_head=True, check_strong=True)]
'''
expect = { fail = "transition", assertion = "StrongReadyFreshness", via = ['HeadChanges', 'AgentRunsReadyCommand'] }

[[run]]
id = "expected-counterexample-plan-revision-moves-before-ready"
class = "expected-counterexample"
purpose = "A new plan revision is approved, with base/head unchanged, after the plan was read; the documented re-fetch covers base/head only."
obligations = ["PRR-TOCTOU-01"]
scenario = '''
SCENARIOS = [scenario(change_budget=1, env_plan=True, check_strong=True)]
'''
expect = { fail = "transition", assertion = "StrongReadyFreshness", via = ['PlanRevisionChanges', 'AgentRunsReadyCommand'] }

[[run]]
id = "expected-counterexample-reply-edited-before-ready"
class = "expected-counterexample"
purpose = "The assessment reply is edited in place from clear to not clear after it was read and before the ready command."
obligations = ["PRR-TOCTOU-01", "PRR-BIND-04"]
scenario = '''
SCENARIOS = [scenario(reply_shapes=("sound-clear", "not-clear"),
                      env_edits=True, check_strong=True)]
'''
expect = { fail = "transition", assertion = "StrongReadyFreshness", via = ['ServiceEditsReply', 'AgentRunsReadyCommand'] }

[[run]]
id = "expected-counterexample-plan-revision-moves-before-merge"
class = "expected-counterexample"
purpose = "The merge command's head guard does not cover the plan revision: a revision approved after the last read is not seen by the merge."
obligations = ["PRR-TOCTOU-02"]
scenario = '''
SCENARIOS = [scenario(starts_ready=True, change_budget=1, env_plan=True,
                      check_strong=True, expect_ready="unchecked")]
'''
expect = { fail = "transition", assertion = "StrongMergeFreshness", via = ['PlanRevisionChanges', 'AgentRunsMergeCommand'] }

[[run]]
id = "expected-counterexample-base-moves-before-merge"

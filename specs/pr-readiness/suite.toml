# ---------------------------------------------------------------------------
# Scenario traces: hand-authored event sequences, each derived from one
# agent-boundary recording through the mapping in fixtures.toml. They are
# model-derived reproductions of what a recording shows, not replays of the
# recording and not generated from it. A trace that runs to its end is a
# behaviour of the model; a refused step is one the model does not permit.
# ---------------------------------------------------------------------------

[[run]]
id = "trace-current-whole-plan"
class = "scenario-trace"
purpose = "Permitting: a current, clear whole-plan verdict is already on the thread; the agent reads everything, re-fetches the candidate, marks the PR ready and reads the transition back."
obligations = ["PRR-ELIG-01", "PRR-ORDER-01", "PRR-HON-04"]
scenario = '''
SCENARIOS = [snapshot("fixture:current-whole-plan", "ready", completeness="current:sound-clear")]
'''
trace = [
  "Any:sc=0", "ChecksComplete", 'Any:ci="green"', 'Any:hosted="clear"',
  "AgentObservesPullRequest", "AgentObservesPlanAndInventory", "AgentReadsChecks",
  "AgentRunsLocalDelta", 'Any:value="clear"', "AgentInspectsDiscussion",
  "AgentReadsReplies", "AgentRechecksCandidate", "AgentDecides",
  "AgentRunsReadyCommand", "AgentReadsBackReady",
]
expect = "pass"

[[run]]
id = "trace-subset-clear"
class = "scenario-trace"
purpose = "Blocking on narrowed evidence: the verdict on the thread is clear for a declared subset; the same reads happen and the model refuses the ready command."
obligations = ["PRR-APPL-03"]
scenario = '''
SCENARIOS = [snapshot("fixture:subset-clear", "draft", completeness="current:subset-clear")]
'''
trace = [
  "Any:sc=0", "ChecksComplete", 'Any:ci="green"', 'Any:hosted="clear"',
  "AgentObservesPullRequest", "AgentObservesPlanAndInventory", "AgentReadsChecks",
  "AgentRunsLocalDelta", 'Any:value="clear"', "AgentInspectsDiscussion",
  "AgentReadsReplies", "AgentRechecksCandidate", "AgentDecides",
  "AgentRunsReadyCommand",
]
expect = { fail = "blocked", executed = 13 }

[[run]]
id = "trace-posted-then-answered"
class = "scenario-trace"
purpose = "Temporal: no question is on the thread; the agent posts one, the service answers it afterwards, and only then does the agent re-fetch, mark the PR ready and read the transition back."
obligations = ["PRR-REQ-01", "PRR-REQ-03", "PRR-ORDER-01", "PRR-HON-04"]
scenario = '''
SCENARIOS = [scenario(authority="ready-only", expect_merge="never")]
'''
trace = [
  "Any:sc=0", "ChecksComplete", 'Any:ci="green"', 'Any:hosted="clear"',
  "AgentObservesPullRequest", "AgentObservesPlanAndInventory", "AgentReadsChecks",
  "AgentRunsLocalDelta", 'Any:value="clear"', "AgentInspectsDiscussion",
  "AgentPostsRequest", "AgentInspectsDiscussion", "ServiceReplies",
  "Any:marker=0", 'Any:shape="sound-clear"', "AgentReadsReplies",
  "AgentRechecksCandidate", "AgentDecides", "AgentRunsReadyCommand",
  "AgentReadsBackReady",
]
expect = "pass"

[[run]]
id = "trace-local-codescene-unavailable"
class = "scenario-trace"
purpose = "Blocking on an unevaluable source: hosted checks are green, the local `cs` is unavailable, and the model refuses to go on to the discussion at all."
obligations = ["PRR-DELIV-03", "PRR-HON-02"]
scenario = '''
SCENARIOS = [snapshot("fixture:local-codescene-unavailable", "draft", local="unavailable", completeness="current:sound-clear")]
'''
trace = [
  "Any:sc=0", "ChecksComplete", 'Any:ci="green"', 'Any:hosted="clear"',
  "AgentObservesPullRequest", "AgentObservesPlanAndInventory", "AgentReadsChecks",
  "AgentRunsLocalDelta", "AgentInspectsDiscussion",
]
expect = { fail = "blocked", executed = 8 }

[[run]]
id = "ready-only-read-back-mismatch"
class = "assurance"
purpose = "A ready-only assignment whose head may change between the ready command and its read-back stops only at a verified transition; after an unmatched read-back the PR stays ready and the agent observes again."
obligations = ["PRR-AUTH-01", "PRR-HON-04", "PRR-PROG-02"]
scenario = '''
SCENARIOS = [scenario(authority="ready-only", change_budget=1, env_head=True,
                      expect_merge="never", expect_progress="ready")]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Property controls: an unmodified specification under a scenario built to
# defeat one assertion. Each shows that the assertion is evaluated and can
# fail, so a pass elsewhere is not vacuous.
# ---------------------------------------------------------------------------

[[run]]
id = "control-reachability-can-fail"
class = "property-control"
purpose = "Declaring readiness reachable where the local `cs` never becomes available must be reported as an unreached state."
obligations = ["PRR-PROG-02"]
scenario = '''
SCENARIOS = [scenario(starts_in_outage=True, outage_recovers=False,
                      expect_ready="reachable", expect_merge="never")]
'''
expect = { fail = "exists", assertion = "ReadyIsReachable" }

[[run]]
id = "control-declared-block-can-fail"
class = "property-control"
purpose = "Declaring an ordinary, clearable assignment blocked must be reported as a violated invariant."
obligations = ["PRR-ELIG-01"]
scenario = '''
SCENARIOS = [scenario(expect_ready="never", expect_merge="unchecked")]
'''
expect = { fail = "always", assertion = "BlockedAssignmentStaysDraft" }

[[run]]
id = "control-no-progress-under-permanent-outage"
class = "property-control"
purpose = "Progress is conditional: with the local `cs` permanently unavailable the assignment never merges, and the checker must report that."
obligations = ["PRR-PROG-02"]
scenario = '''
SCENARIOS = [scenario(starts_in_outage=True, outage_recovers=False,
                      expect_ready="unchecked", expect_merge="unchecked",
                      expect_progress="merged")]
'''
expect = { fail = "liveness", assertion = "ProgressWhenWarranted" }

[[run]]
id = "control-no-progress-while-the-service-is-silent"
class = "property-control"
purpose = "Progress is conditional: a posted request that is never answered never becomes clearance, however long the agent waits."
obligations = ["PRR-PROG-02", "PRR-ELIG-01"]
scenario = '''
SCENARIOS = [scenario(reply_shapes=(), expect_ready="unchecked",
                      expect_merge="unchecked", expect_progress="merged")]
'''
expect = { fail = "liveness", assertion = "ProgressWhenWarranted" }

[[run]]
id = "control-no-progress-when-the-verdict-is-not-clear"
class = "property-control"
purpose = "Progress is conditional: the assessor is never forced to approve, and a not-clear verdict with no repair never becomes readiness."
obligations = ["PRR-PROG-02"]
scenario = '''
SCENARIOS = [scenario(reply_shapes=("not-clear",), expect_ready="unchecked",
                      expect_merge="unchecked", expect_progress="ready")]
'''
expect = { fail = "liveness", assertion = "ProgressWhenWarranted", via = ['Any:shape="not-clear"'] }

[[run]]
id = "control-merge-reachability-can-fail"
class = "property-control"
purpose = "Declaring a merge reachable under a no-merge assignment must be reported as an unreached state."
obligations = ["PRR-AUTH-02"]
scenario = '''
SCENARIOS = [scenario(authority="no-merge", expect_merge="reachable")]
'''
expect = { fail = "exists", assertion = "MergeIsReachable" }

[[run]]
id = "control-declared-merge-block-can-fail"
class = "property-control"
purpose = "Declaring the merge of an ordinary, authorized assignment impossible must be reported as a violated invariant."
obligations = ["PRR-LIFE-03"]
scenario = '''
SCENARIOS = [scenario(expect_merge="never")]
'''
expect = { fail = "always", assertion = "UnauthorizedOrBlockedMergeNeverHappens", via = ["AgentRunsMergeCommand"] }

[[run]]
id = "control-recovery-needs-a-change"
class = "property-control"
purpose = "Declaring recovery after invalidation reachable where nothing can change must be reported as an unreached state."
obligations = ["PRR-LIFE-03"]
scenario = '''
SCENARIOS = [scenario(expect_recovery="merged")]
'''
expect = { fail = "exists", assertion = "RecoveryIsReachable" }

[[run]]
id = "control-stale-ready-needs-a-change"
class = "property-control"
purpose = "Declaring a ready PR with stale evidence reachable where nothing can change must be reported as an unreached state."
obligations = ["PRR-LIFE-02"]
scenario = '''
SCENARIOS = [scenario(expect_stale_ready="reachable")]
'''
expect = { fail = "exists", assertion = "StaleReadyIsReachable" }

[[run]]
id = "control-reentry-needs-an-interruption"
class = "property-control"
purpose = "Declaring re-entry reachable where the session is never interrupted must be reported as an unreached state."
obligations = ["PRR-REQ-03"]
scenario = '''
SCENARIOS = [scenario(expect_reentry="reachable")]
'''
expect = { fail = "exists", assertion = "ReentryConsumesDelayedReply" }

[[run]]
id = "control-undivided-stack-is-not-deliverable"
class = "property-control"
spec = "stack.fizz"
purpose = "Declaring the stack cut from one undivided plan deliverable must be reported as an unreached state."
obligations = ["PRR-STACK-01"]
scenario = '''
LAYERS = UNDIVIDED
EXPECT_DELIVERY = "reachable"
'''

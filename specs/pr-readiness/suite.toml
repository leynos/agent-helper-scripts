# The PR-readiness model-checking suite.
#
# `make model-check` runs every `routine` run; `make model-check-extended`
# runs those and the `extended` ones. See README.md for how to read a result
# and obligations.toml for what each run is evidence of.

[checker]
version = "v0.5.4"
url = "https://github.com/fizzbee-io/fizzbee/releases/download/v0.5.4/fizzbee-v0.5.4-linux_x86.tar.gz"
sha256 = "8a1d0900f9ad920002151922337912e11f9e588a2f1196249fe40bf75370f782"
root = "fizzbee-v0.5.4-linux_x86"

[checker.files]
"fizz" = "8e8f905864b1781a3960f44fb654fc4455ef633e45556adf3fae586b652480a6"
"fizzbee" = "7a5bf006b8606dd0f7d42cfd2022b03e18eca3fada1183c2bf1261392e4da813"
"fizz.env" = "b4ae4663d1f98febad24a968029e6832514336a2a2287ca3c8d532e2ebd35b33"
"parser/parser_bin" = "e0801401bd3d0895e9ec93740ee7130eb91b80a0f8bd81670a7afc163f8c6f45"

[defaults]
spec = "readiness.fizz"
timeout_seconds = 600

# Every option is stated. Every action in the specifications is atomic, so
# one action runs at a time and interruption is an explicit action rather
# than crash-on-yield. `max_actions` is far above any run's node count; the
# launcher refuses a pass whose node count reaches it.
[defaults.options]
max_actions = 1000000
max_concurrent_actions = 1
crash_on_yield = false
deadlock_detection = true
liveness = "strict"

# ---------------------------------------------------------------------------
# Assurance: permitted assignments reach their outcome, under a frozen
# environment in which the strong freshness properties are also checked.
# ---------------------------------------------------------------------------

[[run]]
id = "ordinary-whole-plan"
class = "assurance"
purpose = "An ExecPlan implementation with no proof reaches verified readiness and an authorized merge; with nothing changing, the evidence is also current in reality at each command."
obligations = ["PRR-ELIG-01", "PRR-REQ-01", "PRR-PROG-01", "PRR-TOCTOU-01"]
scenario = '''
SCENARIOS = [scenario(check_strong=True, expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "proof-only-without-execplan"
class = "assurance"
purpose = "A proof-only assignment with no ExecPlan clears on a proof verdict that covers both required proofs, with the completeness and original-issue assessments recorded as justified not-applicables and no revision to echo."
obligations = ["PRR-APPL-02", "PRR-APPL-04", "PRR-BIND-02", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(completeness_applies=False, has_plan=False,
                      proof_applies=True, proofs=("p1", "p2"),
                      check_strong=True, expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "combined-completeness-and-proof"
class = "assurance"
purpose = "Both assessments apply; readiness needs both clear verdicts, each bound to the candidate and the revision."
obligations = ["PRR-ELIG-01", "PRR-APPL-04", "PRR-BIND-02", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(proof_applies=True, proofs=("p1", "p2"),
                      check_strong=True, expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "neither-assessment-applies"
class = "assurance"
purpose = "A PR that neither implements an ExecPlan nor touches a proof nor delivers an issue records every inapplicable assessment as a justified not-applicable and is not held in draft waiting for them."
obligations = ["PRR-APPL-02", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(completeness_applies=False, has_plan=False,
                      check_strong=True, expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "issue-derived-pr"
class = "assurance"
purpose = "An issue-derived ExecPlan implementation records the issue body, asks the original-issue question as well as the completeness one, and reaches verified readiness and an authorized merge only once both clear for the accepted candidate."
obligations = ["PRR-APPL-06", "PRR-BIND-01", "PRR-ELIG-01", "PRR-REQ-01", "PRR-PROG-01", "PRR-TOCTOU-01"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True, has_issue_body=True,
                      check_strong=True, expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "issue-replies-that-do-not-clear"
class = "assurance"
purpose = "Every original-issue reply short of a sound whole-issue verdict — a declared subset, another subject, another candidate, an excused assessment, an unclear verdict or an acknowledgement — and a comment by another author echoing the marker: none lets the PR leave draft."
obligations = ["PRR-APPL-06", "PRR-APPL-01", "PRR-BIND-01", "PRR-BIND-03", "PRR-HON-01"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True,
                      reply_shapes=("subset-clear", "other-subject",
                                    "other-candidate", "not-applicable-claim",
                                    "not-clear", "acknowledgement"),
                      env_foreign=True, expect_ready="never",
                      expect_merge="never")]
'''
expect = "pass"

[[run]]
id = "issue-verdicts-that-must-not-clear"
class = "assurance"
purpose = "A clear completeness verdict can coexist with an original-issue reply that is a declared subset, another subject, another candidate, an excused assessment, an unclear verdict or an acknowledgement; no such reply opens the gate, while readiness stays reachable through a sound whole-issue verdict."
obligations = ["PRR-APPL-06", "PRR-BIND-01", "PRR-ELIG-01"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True,
                      reply_shapes=("sound-clear", "subset-clear",
                                    "other-subject", "other-candidate",
                                    "not-applicable-claim", "not-clear",
                                    "acknowledgement"))]
'''
expect = "pass"

[[run]]
id = "issue-plan-revision-changes-and-recovery"
class = "assurance"
purpose = "A newly approved plan revision with unchanged base/head renews the completeness question but not the original-issue one, whose verdict names no revision; the assignment still reaches its merge."
obligations = ["PRR-APPL-06", "PRR-BIND-02", "PRR-LIFE-03", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True, change_budget=1, env_plan=True,
                      expect_recovery="merged", expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "issue-without-a-recorded-body"
class = "assurance"
purpose = "An issue-derived PR that records no issue body never leaves draft: the missing subject is a scope error, not a question to post."
obligations = ["PRR-APPL-07", "PRR-APPL-05", "PRR-HON-06"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True, has_issue_body=False,
                      expect_ready="never", expect_merge="never")]
'''
expect = "pass"

[[run]]
id = "issue-verdict-names-no-revision"
class = "assurance"
purpose = "An issue-derived ExecPlan assignment reaches readiness on a clear whole-issue verdict that names no plan revision: the issue question asks for no revision echo, so readiness never waits for one."
obligations = ["PRR-APPL-06", "PRR-BIND-02", "PRR-ELIG-01"]
scenario = '''
SCENARIOS = [scenario(issue_derived=True, authority="ready-only",
                      expect_merge="never")]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: evidence lifetime under a changing environment.
# ---------------------------------------------------------------------------

[[run]]
id = "candidate-changes-and-recovery"
class = "assurance"
purpose = "The head or the base may change once at any moment. A ready PR stays ready with stale evidence, and once the agent has observed the new candidate it merges only after renewed evidence for it. A base change between the agent's last read and the merge command is not observed and is not guarded: expected-counterexample-base-moves-before-merge reproduces that."
obligations = ["PRR-BIND-01", "PRR-LIFE-01", "PRR-LIFE-02", "PRR-LIFE-03", "PRR-REQ-04", "PRR-DELIV-04", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(change_budget=1, env_head=True, env_base=True,
                      expect_recovery="merged", expect_stale_ready="reachable",
                      expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "plan-revision-changes-and-recovery"
class = "assurance"
purpose = "A newly approved plan revision with unchanged base/head invalidates the assessment; once the agent has observed the new revision, the question is asked again for it and the old verdict is not reused."
obligations = ["PRR-BIND-02", "PRR-REQ-04", "PRR-LIFE-03", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(change_budget=1, env_plan=True,
                      expect_recovery="merged", expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "inventory-changes-and-recovery"
class = "assurance"
purpose = "The required proof inventory grows from one proof to two; once the agent has observed the wider inventory, the earlier, narrower answer does not clear it."
obligations = ["PRR-APPL-04", "PRR-REQ-04", "PRR-LIFE-03", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(completeness_applies=False, has_plan=False,
                      proof_applies=True, proofs=("p1",),
                      wider_proofs=("p1", "p2"), change_budget=1,
                      env_inventory=True, expect_recovery="merged",
                      expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "already-ready-on-assignment"
class = "assurance"
purpose = "A PR that was ready on assignment stays ready; missing or invalidated assessments block the merge and are obtained before it."
obligations = ["PRR-LIFE-01", "PRR-LIFE-03", "PRR-HON-04", "PRR-HON-05"]
scenario = '''
SCENARIOS = [scenario(starts_ready=True, change_budget=1, env_plan=True,
                      expect_ready="unchecked", expect_recovery="merged",
                      expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "merge-head-guard-closes-the-head-race"
class = "assurance"
purpose = "When only the head can change, the head-conditional merge command makes the strong property hold: no merge takes effect on a head the evidence does not cover."
obligations = ["PRR-LIFE-03", "PRR-TOCTOU-02"]
scenario = '''
SCENARIOS = [scenario(starts_ready=True, change_budget=1, env_head=True,
                      check_strong=True, expect_ready="unchecked")]
'''
expect = "pass"

[[run]]
id = "interruption-and-reentry"
class = "assurance"
purpose = "The session is interrupted up to twice at any step, including between a command and its read-back. Re-entry adopts the outstanding request, consumes its late reply, and posts no replacement."
obligations = ["PRR-REQ-02", "PRR-REQ-03", "PRR-HON-04", "PRR-HON-05", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(proof_applies=True, proofs=("p1", "p2"), crash_budget=2,
                      expect_reentry="reachable", expect_progress="merged")]
'''
expect = "pass"

[[run]]
id = "interacting-changes-and-interruption"
class = "assurance"
purpose = "The combined configuration: head, plan revision or interruption in any order, with both a clear and a not-clear reply possible."
obligations = ["PRR-ELIG-01", "PRR-BIND-01", "PRR-BIND-02", "PRR-REQ-02", "PRR-REQ-04", "PRR-LIFE-02", "PRR-LIFE-03"]
scenario = '''
SCENARIOS = [scenario(change_budget=1, env_head=True, env_plan=True,
                      crash_budget=1, reply_shapes=("sound-clear", "not-clear"),
                      expect_recovery="merged", expect_stale_ready="reachable")]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: replies that look favourable and do not clear.
# ---------------------------------------------------------------------------

[[run]]
id = "completeness-replies-that-do-not-clear"
class = "assurance"
purpose = "Every completeness reply short of a sound whole-plan verdict, and a comment by another author echoing the marker: none of them, in any order, lets the PR leave draft."
obligations = ["PRR-APPL-01", "PRR-APPL-03", "PRR-BIND-01", "PRR-BIND-02", "PRR-BIND-03", "PRR-HON-01"]
scenario = '''
SCENARIOS = [scenario(reply_shapes=("subset-clear", "other-subject",
                                    "no-revision-echo",
                                    "superseded-revision-echo",
                                    "other-candidate",
                                    "not-applicable-claim", "not-clear",
                                    "acknowledgement"),
                      env_foreign=True, expect_ready="never",
                      expect_merge="never")]
'''
expect = "pass"

[[run]]
id = "proof-replies-that-do-not-clear"
class = "assurance"
purpose = "Every proof reply short of a sound verdict covering both required proofs, including one covering only the first: none lets the PR leave draft."
obligations = ["PRR-APPL-01", "PRR-APPL-04", "PRR-BIND-01", "PRR-BIND-03", "PRR-HON-01"]
scenario = '''
SCENARIOS = [scenario(completeness_applies=False, has_plan=False,
                      proof_applies=True, proofs=("p1", "p2"),
                      reply_shapes=("partial-proofs", "no-proofs",
                                    "other-candidate", "not-applicable-claim",
                                    "not-clear", "acknowledgement"),
                      env_foreign=True, expect_ready="never",
                      expect_merge="never")]
'''
expect = "pass"

[[run]]
id = "edited-replies"
class = "assurance"
purpose = "A reply may be edited in place once, in either direction, and another author may comment; each command still rests on the reply as this pass read it, which MergeFollowsFreshReads and ReadyFollowsFreshReads check against what the read returned."
obligations = ["PRR-BIND-04", "PRR-BIND-03", "PRR-HON-01", "PRR-ORDER-01"]
scenario = '''
SCENARIOS = [scenario(reply_shapes=("sound-clear", "not-clear", "subset-clear"),
                      env_edits=True, env_foreign=True)]
'''
expect = "pass"

[[run]]
id = "undivided-plan-layer"
class = "assurance"
purpose = "A managed-stack layer that implements part of an undivided plan can be told its declared subset is clear and never leaves draft on it; it keeps polling."
obligations = ["PRR-APPL-03", "PRR-STACK-01"]
scenario = '''
SCENARIOS = [scenario(whole_plan=False,
                      reply_shapes=("sound-clear", "subset-clear", "not-clear"),
                      expect_ready="never", expect_merge="never")]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: delivery evidence.
# ---------------------------------------------------------------------------

[[run]]
id = "delivery-gates-may-fail"
class = "assurance"
purpose = "CI may be red, hosted CodeScene may report findings and the local delta may report findings; no question is posted and no transition is made unless all three hold for the observed candidate."
obligations = ["PRR-DELIV-01", "PRR-DELIV-02", "PRR-DELIV-03", "PRR-REQ-01", "PRR-HON-03"]
scenario = '''
SCENARIOS = [scenario(ci_outcomes=("green", "red"),
                      hosted_outcomes=("clear", "findings"),
                      local_outcomes=("clear", "findings"))]
'''
expect = "pass"

[[run]]
id = "local-codescene-never-available"
class = "assurance"
purpose = "Hosted checks are green and the local `cs` never becomes available: the delta is unverified, no question is posted, the PR stays in draft, and the agent keeps observing rather than stopping."
obligations = ["PRR-DELIV-03", "PRR-HON-02", "PRR-PROG-02"]
scenario = '''
SCENARIOS = [scenario(starts_in_outage=True, outage_recovers=False,
                      expect_ready="never", expect_merge="never")]
'''
expect = "pass"

[[run]]
id = "transient-outage-then-progress"
class = "assurance"
purpose = "The local `cs` starts unavailable and may fail once more; because it recovers, the assignment still reaches its merge."
obligations = ["PRR-DELIV-03", "PRR-HON-02", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [scenario(starts_in_outage=True, outage_budget=1, crash_budget=1,
                      expect_progress="merged")]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: authority and explicit impasses. These two runs check several
# assignments in one exploration; Init chooses among them.
# ---------------------------------------------------------------------------

[[run]]
id = "authority-boundaries"
class = "assurance"
purpose = "An assignment that must stay draft never issues the ready command; ready-only and no-merge assignments become ready and never merge."
obligations = ["PRR-AUTH-01", "PRR-AUTH-02", "PRR-PROG-01"]
scenario = '''
SCENARIOS = [
    scenario(authority="stay-draft", expect_ready="never", expect_merge="never"),
    scenario(authority="ready-only", expect_ready="unchecked",
             expect_merge="never", expect_progress="ready"),
    scenario(authority="no-merge", expect_ready="unchecked",
             expect_merge="never", expect_progress="ready"),
]
'''
expect = "pass"

[[run]]
id = "scope-errors-are-impasses"
class = "assurance"
purpose = "An applicable completeness assessment with no approved revision, an applicable proof assessment with an empty inventory, an issue-derived PR with no recorded issue body, and an inapplicable assessment with no justification each end in a recorded impasse with the draft untouched."
obligations = ["PRR-APPL-02", "PRR-APPL-05", "PRR-APPL-07", "PRR-HON-06"]
scenario = '''
SCENARIOS = [
    scenario(has_plan=False, expect_ready="never", expect_merge="never",
             expect_progress="impasse"),
    scenario(proof_applies=True, proofs=(), expect_ready="never",
             expect_merge="never", expect_progress="impasse"),
    scenario(issue_derived=True, has_issue_body=False,
             expect_ready="never", expect_merge="never",
             expect_progress="impasse"),
    scenario(completeness_applies=False, has_plan=False, na_justified=False,
             expect_ready="never", expect_merge="never",
             expect_progress="impasse"),
]
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: the managed-stack conflict and its documented alternatives.
# ---------------------------------------------------------------------------

[[run]]
id = "stack-from-one-undivided-plan"
class = "assurance"
spec = "stack.fizz"
purpose = "Two layers cut from one undivided plan: the lower layer never leaves draft, so the stack never merges, while both layers are still being observed."
obligations = ["PRR-STACK-01"]
scenario = '''
LAYERS = UNDIVIDED
EXPECT_DELIVERY = "never"
'''
expect = "pass"

[[run]]
id = "stack-from-independent-plans"
class = "assurance"
spec = "stack.fizz"
purpose = "One independently complete approved plan per layer: every layer can leave draft and the stack merges."
obligations = ["PRR-STACK-02"]
scenario = '''
LAYERS = SPLIT
EXPECT_DELIVERY = "reachable"
'''
expect = "pass"

[[run]]
id = "undivided-plan-in-one-pr"
class = "assurance"
spec = "stack.fizz"
purpose = "The undivided plan delivered as a single PR leaves draft and merges."
obligations = ["PRR-STACK-02"]
scenario = '''
LAYERS = SINGLE
EXPECT_DELIVERY = "reachable"
'''
expect = "pass"

# ---------------------------------------------------------------------------
# Assurance: the frozen snapshot tables. Each row is one thread and one set
# of delivery facts with nothing changing; its expectation is what the
# retired Python decision model answered for the equivalent snapshot when the
# two were compared at migration. Init chooses among the rows, so one run
# checks them all: a row that became ready while marked `draft` fails
# BlockedAssignmentStaysDraft, and one that stayed in draft while marked
# `ready` fails ProgressWhenWarranted.
# ---------------------------------------------------------------------------

[[run]]
id = "snapshot-regression-table"
class = "assurance"
purpose = "Every single-fact shortfall and every all-clear assignment: each shortfall holds the draft, and each all-clear assignment leaves it."
obligations = ["PRR-ELIG-01", "PRR-APPL-01", "PRR-APPL-02", "PRR-APPL-03", "PRR-APPL-04", "PRR-APPL-05", "PRR-APPL-06", "PRR-APPL-07", "PRR-BIND-01", "PRR-BIND-02", "PRR-DELIV-01", "PRR-DELIV-02", "PRR-DELIV-03"]
scenario = '''
SCENARIOS = [
    snapshot("s000", "draft"),
    snapshot("s001", "draft", completeness="current:none"),
    snapshot("s002", "draft", completeness="another-candidate:sound-clear"),
    snapshot("s003", "draft", completeness="superseded-revision:sound-clear"),
    snapshot("s004", "ready", completeness="current:sound-clear"),
    snapshot("s005", "draft", completeness="current:subset-clear"),
    snapshot("s006", "draft", completeness="current:other-subject"),
    snapshot("s007", "draft", completeness="current:no-revision-echo"),
    snapshot("s008", "draft", completeness="current:superseded-revision-echo"),
    snapshot("s009", "draft", completeness="current:other-candidate"),
    snapshot("s010", "draft", completeness="current:not-applicable-claim"),
    snapshot("s011", "draft", completeness="current:not-clear"),
    snapshot("s012", "draft", completeness="current:acknowledgement"),
    snapshot("s013", "draft", ci="red", completeness="current:sound-clear"),
    snapshot("s014", "draft", hosted="findings", completeness="current:sound-clear"),
    snapshot("s015", "draft", local="findings", completeness="current:sound-clear"),
    snapshot("s016", "draft", local="unavailable", completeness="current:sound-clear"),
    snapshot("s017", "draft", na_justified=False, completeness="current:sound-clear"),
    snapshot("s018", "draft", proof_applies=True, proofs=("p1", "p2"), proof="current:sound-clear"),
    snapshot("s019", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:none", proof="current:sound-clear"),
    snapshot("s020", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="another-candidate:sound-clear", proof="current:sound-clear"),
    snapshot("s021", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="superseded-revision:sound-clear", proof="current:sound-clear"),
    snapshot("s022", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear"),
    snapshot("s023", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:none"),
    snapshot("s024", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="another-candidate:sound-clear"),
    snapshot("s025", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="superseded-revision:sound-clear"),
    snapshot("s026", "ready", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:sound-clear"),
    snapshot("s027", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:partial-proofs"),
    snapshot("s028", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:no-proofs"),
    snapshot("s029", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:no-revision-echo"),
    snapshot("s030", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:superseded-revision-echo"),
    snapshot("s031", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:other-candidate"),
    snapshot("s032", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:not-applicable-claim"),
    snapshot("s033", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:not-clear"),
    snapshot("s034", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:sound-clear", proof="current:acknowledgement"),
    snapshot("s035", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:subset-clear", proof="current:sound-clear"),
    snapshot("s036", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:other-subject", proof="current:sound-clear"),
    snapshot("s037", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:no-revision-echo", proof="current:sound-clear"),
    snapshot("s038", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:superseded-revision-echo", proof="current:sound-clear"),
    snapshot("s039", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:other-candidate", proof="current:sound-clear"),
    snapshot("s040", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:not-applicable-claim", proof="current:sound-clear"),
    snapshot("s041", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:not-clear", proof="current:sound-clear"),
    snapshot("s042", "draft", proof_applies=True, proofs=("p1", "p2"), completeness="current:acknowledgement", proof="current:sound-clear"),
    snapshot("s043", "draft", proof_applies=True, proofs=("p1", "p2"), ci="red", completeness="current:sound-clear", proof="current:sound-clear"),

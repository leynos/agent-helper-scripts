[project]
name = "agent-helper-scripts"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
dev = [
  "cmd-mox",
  "cuprum==0.2.0b2",
  "cyclopts>=5.4.0,<6",
  "femtologging",
  "hypothesis",
  "pytest",
  "pytest-bdd",
  "pyyaml>=6.0.3",
  "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
  "syrupy",
  "yamllint",
]

[tool.pytest.ini_options]
markers = [
  "slow: exercises an external tool or process boundary",
]

[tool.uv.sources]
femtologging = { git = "https://github.com/leynos/femtologging.git", rev = "c77e726e0053bcf6cbbe43334e05cd10704e1b9a" }

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  make-ci:
    name: Makefile gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      # Two contracts execute a guide example with `cargo test --doc`:
      # `tests/test_documentation_style_guide_rust_doctest.py` and
      # `tests/test_rust_doctest_dry_guide_examples.py`. The latter needs
      # edition 2024 support, which stable Rust 1.85 or later provides. The
      # action publishes toolchain branches rather than release tags, so it is
      # pinned by commit; the explicit input selects the latest stable release,
      # and the action installs the minimal profile.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: stable

      # Markdown is linted by the upstream action rather than an installation
      # of our own: its release carries the linter's whole dependency graph, so
      # nothing is resolved from the registry at run time. Dependabot manages
      # this version alongside the other actions the workflow uses. Mermaid
      # validation (make nixie) needs a renderer this runner does not provide,
      # so it stays a local-only gate.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: "**/*.md"

      # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 is the first
      # release with `--check` and `--git`.
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@43f856c5d807eb9c2c7e6bf59c6612c618988d85
        with:
          version: "0.6.1"

# `make model-check` runs a pinned FizzBee release and does not fetch
      # it. This is the only networked step of the model-checking gate: the
      # launcher verifies the archive and the unpacked files against the
      # digests in specs/pr-readiness/suite.toml.
      - name: Install the pinned FizzBee release
        run: make fizzbee

      # Record the resolved toolchain so a failure can be attributed to the
      # version the gate actually used.
      - name: Record Rust toolchain
        run: cargo --version

      # The same gate sequence as `make ci`, minus the Markdown gate above.
      # The tests build the pinned femtologging checkout, whose
      # `.cargo/config.toml` selects the mold linker on Linux. This runner has
      # no mold, and an assigned `RUSTFLAGS` replaces that table, so an empty
      # value makes the build link with the runner's own toolchain. This is
      # the same displacement femtologging's wheel builds use in its manylinux
      # containers.
      - name: Run CI gate sequence
        run: make ci CI_SKIP_MARKDOWNLINT=1
        env:
          RUSTFLAGS: ""

      # The scripting standards declare `cyclopts>=4.3,<5`; `make ci`
      # exercises the resolved dev version. Run the declared floor separately
      # so this job's log records the installed version and the floor result.
      - name: Check the Cyclopts floor
        run: make cyclopts-floor

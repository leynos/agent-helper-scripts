name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  make-ci:
    name: Makefile gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      # Markdown is linted by the upstream action rather than an installation
      # of our own: its release carries the linter's whole dependency graph, so
      # nothing is resolved from the registry at run time. Dependabot manages
      # this version alongside the other actions the workflow uses. Mermaid
      # validation (make nixie) needs a renderer this runner does not provide,
      # so it stays a local-only gate.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@4580e1612f6407034edd6c0e4e316d725920867b  # v24.2.0
        with:
          globs: "**/*.md"

      # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the first
      # release with `--check` and `--git`.
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@c5a54701c8603a0fa756a6b34c49bc2af75a6c11
        with:
          version: "0.6.0"

      # The same gate sequence as `make ci`, minus the Markdown gate above.
      - name: Run CI gate sequence
        run: make ci CI_SKIP_MARKDOWNLINT=1

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  make-ci:
    name: Makefile gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      # The style-guide doctest contract executes an example with
      # `cargo test --doc`, so the gate needs a Rust toolchain. The action
      # publishes toolchain branches rather than release tags, so it is pinned
      # by commit; the explicit input selects the latest stable release, and
      # the action installs the minimal profile.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master, 2026-10-16
        with:
          toolchain: stable

      # Markdown is linted by the upstream action rather than an installation
      # of our own: its release carries the linter's whole dependency graph, so
      # nothing is resolved from the registry at run time. Dependabot manages
      # this version alongside the other actions the workflow uses. Mermaid
      # validation (make nixie) needs a renderer this runner does not provide,
      # so it stays a local-only gate.
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: "**/*.md"

      # `make check-fmt` runs `mdtablefix --check --git`; 0.6.1 is the first
      # release with `--check` and `--git`.
      - name: Install mdtablefix
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@fc0e10220207b951bf693aba2ce4f9dafc1a0206
        with:
          version: "0.6.1"

      # The same gate sequence as `make ci`, minus the Markdown gate above.
      - name: Run CI gate sequence
        run: make ci CI_SKIP_MARKDOWNLINT=1

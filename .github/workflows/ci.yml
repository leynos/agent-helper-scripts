name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  MARKDOWNLINT_CLI2_VERSION: 0.22.1

jobs:
  make-ci:
    name: Makefile gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      # Pinned so the Markdown gate cannot change under a passing PR. Mermaid
      # validation (make nixie) needs a renderer this runner does not provide,
      # so it stays a local-only gate.
      - name: Install Markdown tooling
        run: npm install --global "markdownlint-cli2@${MARKDOWNLINT_CLI2_VERSION}"

      - name: Run CI gate sequence
        run: make ci

# Repository-specific identifiers and deliberate negative spelling fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "ANALYZER",
  "MOLD",
  "analyzer",
  "edn",
  "ises",
  "mold",
]

[words.corrections]
polymerisable = "polymerizable"
polymerisably = "polymerizably"
polymerisation = "polymerization"
polymerisations = "polymerizations"
polymerise = "polymerize"
polymerised = "polymerized"
polymeriser = "polymerizer"
polymerisers = "polymerizers"
polymerises = "polymerizes"
polymerising = "polymerizing"

[patterns]
ignore = [
  '`EXPLAIN ANALYZE`',
  '`colorScheme`',
  '`colors`',
  '`hand-written`',
  'RUST_ANALYZER(?:_PRECHECK)?',
  '\bMOLD\b',
  '\bmold\b',
  '\bartifact_name\b',
  '\bcolor:',
  # GitHub's pull_request_target activity type. It is an identifier the
  # automerge workflow matches on, so it cannot take the British spelling;
  # matching the whole event list, bounded at each end, keeps the allowance off
  # the word itself and off any longer name that contains it.
  '\blabeled, ready_for_review\b',
  # A rehearsal recording of the agent's own comment listing. Its `--jq`
  # projection asked for `.body[0:80]` and the slice ended mid-word, leaving
  # the fragment `**Assessed ba` in the captured stdout. The recording is
  # verbatim evidence of what the run received, so the fragment cannot be
  # repaired without inventing bytes; this matches the two-character stub only
  # where a markdown field label was truncated, and nowhere else.
  '\*\*Assessed ba\b',
]

[files]
exclude = [
  "typos.local.toml",
  # Authored negative samples and an immutable consumer-policy snapshot.
  # Tests stage sample contents at ordinary paths outside this exclusion.
  "tests/fixtures/tokio_spelling_cases.json",
]

# Repository-specific identifiers and deliberate negative spelling fixtures.

schema = 1

[oxford]
stems = []

[words]
accepted = [
  "ANALYZER",
  "MOLD",
  "analyzer",
  "edn",
  "ises",
  "mold",
]

[words.corrections]
polymerisable = "polymerizable"
polymerisably = "polymerizably"
polymerisation = "polymerization"
polymerisations = "polymerizations"
polymerise = "polymerize"
polymerised = "polymerized"
polymeriser = "polymerizer"
polymerisers = "polymerizers"
polymerises = "polymerizes"
polymerising = "polymerizing"

[patterns]
ignore = [
  # Citation titles are reproduced verbatim in the documentation library.
  'Azure Architecture\n\s+Center \| Microsoft Learn',
  'How to organise your Rust tests',
  # Product names and placeholder tokens the dictionary would otherwise split.
  'HashiCorp',
  'currentColor',
  '\{COLOR\}',
  # Inline code spans quoting CSS identifiers, CLI flags, Rust attribute
  # arguments, generic parameters, and deliberately misspelt example names.
  '`[^`\n]*(?:color|center|flavor|artifact|Ser|iamge_id)[^`\n]*`',
  '`EXPLAIN ANALYZE`',
  '`colorScheme`',
  '`colors`',
  '`hand-written`',
  'RUST_ANALYZER(?:_PRECHECK)?',
  '\bMOLD\b',
  '\bmold\b',
  '\bartifact_name\b',
  '\bcolor:',
]

[files]
exclude = [
  "typos.local.toml",
]
